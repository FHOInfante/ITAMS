<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Change Password</title>

    <link rel="stylesheet" href="../css/changeDefaultPassword.css">

    <!-- Lucide Icons -->
    <script src="https://unpkg.com/lucide@latest"></script>
    <link rel="icon" type="image/png" href="/assets/itd-logo-tab.png">
</head>
<body>

<main class="main-container">
    <section class="change-wrapper">

        <!-- LEFT PANEL -->
        <div class="left-panel">

            <div class="circle circle-1"></div>
            <div class="circle circle-2"></div>
            <div class="circle circle-3"></div>

            <div class="icon-grid">
                <div class="icon-tile"><i data-lucide="monitor"></i></div>
                <div class="icon-tile"><i data-lucide="cpu"></i></div>
                <div class="icon-tile"><i data-lucide="smartphone"></i></div>
                <div class="icon-tile"><i data-lucide="database"></i></div>
            </div>

            <div class="left-content">
                <h1>Password Security</h1>
            </div>

        </div>

        <!-- RIGHT PANEL -->
        <div class="right-panel">

            <div class="form-container">

                <!-- LOGO -->
                <div class="brand">
                    <div class="logo-box">
                        <img src="../assets/itd-logo.png" alt="IT Logo">
                    </div>

                    <div>
                        <p class="brand-title">IT Asset Management</p>
                    </div>
                </div>

                <!-- HEADER -->
                <div class="welcome-text">
                    <h2>Change Password</h2>
                    <p>Secure your account by updating your password</p>
                </div>

                <!-- INFO -->
                <div class="info-box">
                    Change your default password to secure your account and access the dashboard.
                </div>

                <!-- FORM -->
                <form id="changePasswordForm">

                    <div id="errorMessage" class="error-box hidden"></div>

                    <label class="password-field-wrapper">
                        <span>New Password</span>
                        <div class="password-input-wrapper">
                            <input
                                type="text"
                                id="newPassword"
                                placeholder="Enter new password"
                                autocomplete="new-password"
                            >
                        </div>

                        <div id="passwordRequirements" class="password-requirements hidden">
                            <p class="password-requirements-title">Password must contain:</p>
                            <ul>
                                <li id="req-length" data-met="false">At least 8 characters</li>
                                <li id="req-upper" data-met="false">An uppercase letter (A-Z)</li>
                                <li id="req-lower" data-met="false">A lowercase letter (a-z)</li>
                                <li id="req-special" data-met="false">A special character (!@#$...)</li>
                            </ul>
                        </div>
                    </label>

                    <label>
                        <span>Confirm New Password</span>
                        <div class="password-input-wrapper">
                            <input
                                type="password"
                                id="confirmPassword"
                                placeholder="Confirm new password"
                            >
                            <button type="button" class="toggle-password-btn" id="toggleConfirmPassword" aria-label="Show password" aria-pressed="false">
                                <i data-lucide="eye"></i>
                            </button>
                        </div>
                    </label>

                    <button type="submit">
                        Save Password and Continue
                    </button>

                </form>

            </div>

        </div>

    </section>
</main>

<!-- KEEPING YOUR SCRIPTS EXACTLY -->
<div id="successToast" class="success-toast hidden">
    <i data-lucide="check-circle"></i>
    <span id="successToastText">Password updated successfully!</span>
</div>

<script>
    lucide.createIcons();
</script>

<script src="../script/changeDefaultPassword.js" defer></script>

</body>
</html>
