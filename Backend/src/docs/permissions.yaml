  /permission:
    get:
      tags:
        - Permissions
      summary: Get all system permissions
      description: >
        Returns the complete list of all 42 permissions defined in the system,
        ordered by permission_id. Intended for frontends that need to populate
        permission selection interfaces when managing temporary grants.


        Required Permission: Authenticated user (bearer token). No specific permission number required for read access.
      security:
        - BearerAuth: []
      responses:
        "200":
          description: Successfully retrieved the full list of system permissions.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/PermissionObject"
