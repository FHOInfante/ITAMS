paths:
  /report/computer:
    get:
      tags:
        - Reports
      summary: Download computer asset report
      description: >
        Generates and downloads an Excel (.xlsx) report containing computer asset records,
        including assigned end-user details and linked peripherals.


        Requires Permission **42 (Generate Report)**.


        **Date Filter:** Use the optional query parameters below to filter records by
        received_date. Both parameters are independent — either or both may be supplied.

        - Supplying only date_from returns all records received on or after that date.

        - Supplying only date_to returns all records received on or before that date.

        - Supplying both returns records within the inclusive date range.


        **Column Selection:** Use the optional columns query parameter to control which
        columns appear in the report, and in what order.

        - If columns is omitted entirely, the report includes every available column below,
          in the default order shown.

        - If columns is supplied, only the listed columns are included, presented in the
          exact left-to-right order the keys were given in.

        - Any key in columns that does not match one of the allowed keys below causes the
          entire request to fail with a 400 response listing the offending key(s). No
          partial reports are generated.


        **Allowed column keys for this report (in default order):**

        - computer_name

        - asset_tag

        - serial_no

        - brand

        - model

        - device_type

        - operating_system

        - computer_status

        - asset_condition

        - received_date

        - warranty_expiry

        - vendor

        - processor

        - ram_size

        - storage_type

        - storage_capacity

        - ip_address

        - mac_address

        - network_connectivity

        - has_vpn_access

        - anydesk_ip

        - cost

        - assigned_user_name

        - assigned_user_emp_id

        - assigned_date

        - to_return_by

        - peripherals

        - remarks


        The response is a binary .xlsx file download, not JSON. The filename returned
        by the server will be computer_report.xlsx.


        A successful download is recorded as an audit log entry of interaction type
        Download Computer Report, capturing the requesting user, the resolved column
        list, and the applied date range.
      security:
        - BearerAuth: []
      parameters:
        - in: query
          name: date_from
          schema:
            type: string
            format: date
          required: false
          description: >
            Optional. Filters records where received_date is on or after this date.
            Format: YYYY-MM-DD. Example: 2023-01-01
          example: "2023-01-01"
        - in: query
          name: date_to
          schema:
            type: string
            format: date
          required: false
          description: >
            Optional. Filters records where received_date is on or before this date.
            Format: YYYY-MM-DD. Example: 2024-12-31
          example: "2024-12-31"
        - in: query
          name: columns
          schema:
            type: string
          required: false
          description: >
            Optional. Comma-separated list of column keys to include in the report, in the
            exact order they should appear. See the endpoint description above for the full
            list of allowed keys. When omitted, all columns are included in default order.
          example: "computer_name,brand,model,computer_status,assigned_user_name"
      responses:
        "200":
          description: >
            Excel file download. The response body is the raw binary content of the
            .xlsx file. The Content-Disposition header will be set to
            attachment; filename="computer_report.xlsx".
          content:
            application/vnd.openxmlformats-officedocument.spreadsheetml.sheet:
              schema:
                type: string
                format: binary
        "400":
          description: >
            Bad Request — One or more date parameters are not in YYYY-MM-DD format, the
            columns parameter contains one or more unrecognized keys, or columns resolved
            to an empty set.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MessageResponse"
              examples:
                invalidDateFrom:
                  summary: date_from is not a valid date
                  value:
                    message: "Invalid dateFrom format. Use YYYY-MM-DD."
                invalidDateTo:
                  summary: date_to is not a valid date
                  value:
                    message: "Invalid dateTo format. Use YYYY-MM-DD."
                invalidColumns:
                  summary: One or more column keys are not recognized
                  value:
                    message: "Invalid column key(s): computer_idd, statuss"
                    invalidKeys: ["computer_idd", "statuss"]
                emptyColumns:
                  summary: columns parameter resolved to no valid columns
                  value:
                    message: "No valid columns were specified."
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "500":
          description: "Internal Server Error — Report generation failed."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MessageResponse"
              example:
                message: "Failed to generate computer report"

