  "/computer/:id":
    get:
      tags:
        - Computers
      summary: Get a single computer by ID
      description: >
        Returns the full details of a specific computer asset including linked peripherals,
        linked pre-installed programs, and assigned end user.


        Required permission: Authenticated user (bearer token). No specific permission number required for read access.
      security:
        - BearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          description: "**[REQUIRED]** The computer_id of the target record."
          schema:
            type: integer
          example: 1
      responses:
        "200":
          description: Computer record found and returned.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ComputerObject"
        "400":
          description: "Bad Request — id is missing or not a valid integer."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MessageResponse"
              example:
                message: "Missing computer ID"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          description: >
            Not Found — The computer does not exist.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MessageResponse"
              examples:
                "Computer Not Found":
                  value:
                    message: "Computer not found"
        "500":
          $ref: "#/components/responses/InternalError"

    put:
      tags:
        - Computers
      summary: Edit / fully update a computer record
      description: >
        Performs a full update of an existing computer asset record. All required fields must be supplied.


        **Required Permission: 24 (Edit Asset - Computer)** — Accessible by: '**IT Manager**' and '**IT Supervisor**'


        **Peripherals:** The peripherals array fully replaces all current associations.
        Send an empty array or omit to clear all.


        **Programs:** The programs array fully replaces all current associations.
        Send an empty array or omit to clear all.


        **End-user assignment:** Provide euEmpId + assignedDate to assign or re-assign.
        Send euEmpId as null to unassign. Omit euEmpId entirely to leave the existing assignment unchanged.
        If the end user does not yet exist, also supply euName, euDivision, euDepartment, and euLocation
        to auto-register them.
        Assignment is blocked if the end user has a Resigned status.


        **Important:** If euEmpId already belongs to an existing end user, any euName, euDivision,
        euDepartment, euLocation, euEmail, or euContactNo also included in the payload are silently
        ignored. Only euEmpId and assignedDate are used in that case — the existing end user's
        stored details are never overwritten as a side effect of an asset assignment. Those fields
        are consulted only when euEmpId does not yet correspond to any registered end user.


        **euDepartment** (used when auto-registering a new end user) accepts three formats:


        - **Integer** — resolved directly as a department ID. Example: 13

        - **Numeric string** — parsed and resolved as a department ID. Example: "13"

        - **Name string** — resolved by a case-insensitive name match. Example: "it department"

        - Returns 404 if the referenced department does not exist.
      security:
        - BearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          description: "**[REQUIRED]** The computer_id to update."
          schema:
            type: integer
          example: 1
      requestBody:
