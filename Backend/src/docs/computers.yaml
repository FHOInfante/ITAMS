paths:
  /computer:
    get:
      tags:
        - Computers
      summary: Get all computers
      description: >
        Returns a list of all computer asset records including linked peripherals, linked
        pre-installed programs, and assigned end user.


        Required permission: Authenticated user (bearer token). No specific permission number required for read access.
      security:
        - BearerAuth: []
      responses:
        "200":
          description: List of all computer records.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/ComputerObject"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "500":
          $ref: "#/components/responses/InternalError"

    post:
      tags:
        - Computers
      summary: Add a new computer
      description: >
        Creates a new computer asset record.


        **Required Permission: 9 (Add Asset - Computer)** — Accessible by: '**IT Manager**', '**IT Supervisor**', and '**IT Helpdesk**'


        Required Fields: **computerName**, **serialNo**, **model**, **brand**, **deviceType**, **operatingSystem**, 
        **computerStatus**, **receivedDate**, **vendor**, **processor**, **ramSize**, 
        **storageType**, **storageCapacity**, **ipAddress**, **networkConnectivity**


        Note: **warrantyExpiry** and **macAddress** are optional — the controller does not enforce them
        as required even though they appear required-sounding; both fall back to null if omitted.


        Valid Options (networkConnectivity): "WIFI", "LAN", or "WIFI & LAN"


        **Peripherals:** Supply an optional peripherals array to link existing peripheral records.
        Each entry is looked up by peripheral_name or peripheral_id. Returns 404 if any
        referenced peripheral does not exist.


        **Programs:** Supply an optional programs array to link existing pre-installed program
        records. Each entry is looked up by program_name or program_id. Returns 404 if any
        referenced program does not exist.


        **End-user assignment:** Provide euEmpId and assignedDate to assign the computer on creation.
        If the end user (by euEmpId) does not yet exist, also supply euName, euDivision,
        euDepartment, and euLocation to auto-register them.
        Assignment is blocked if the end user has a Resigned status.


        **Important:** If euEmpId already belongs to an existing end user, any euName, euDivision,
        euDepartment, euLocation, euEmail, or euContactNo also included in the payload are silently
        ignored. Only euEmpId and assignedDate are used in that case — the existing end user's
        stored details are never overwritten as a side effect of an asset assignment. Those fields
        are consulted only when euEmpId does not yet correspond to any registered end user.


        **euDepartment** (used when auto-registering a new end user) accepts three formats:

        - **Integer** — resolved directly as a department ID. Example: 13

        - **Numeric string** — parsed and resolved as a department ID. Example: "13"

        - **Name string** — resolved by a case-insensitive name match. Example: "it department"

        - Returns 404 if the referenced department does not exist.
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ComputerWriteRequest"
            examples:
              minimal:
                summary: "Minimal — Required fields only, no assignment"
                value:
                  computerName: "PC-HQ-001"
