  /audit/user:
    get:
      tags:
        - Audit Logs
      summary: Retrieve the audit trail for all system user accounts
      description: >
        Returns audit trail entries for every interaction that has ever
        targeted a system user account (target_table = "user"), across every
        user in the system. Entries are ordered newest interaction first.


        Covered interaction types: "Add System User", "Update System User",
        "Grant Permission", "Revoke Permission".


        Each entry is a flattened BizBox-style row. "Add System User" is a
        creation event: it produces one row per populated field on the new
        account (e.g. User Name, User Email, User Employee ID, User Role,
        User Status, User Username), with old_value null and new_value set
        to the field's initial value. "Update System User" produces one row
        per individual field (user_email, user_role, and/or user_status)
        that actually changed between the before and after snapshot - an
        update that touched multiple fields will appear as multiple rows
        sharing the same audit_log_id. "Grant Permission" and "Revoke
        Permission" each produce a single synthetic "Permissions" field row,
        where old_value and new_value are the user's FULL held permission_id
        set (sorted ascending, comma-separated) immediately before and after
        the grant/revoke - not just the permission_id(s) that were
        granted/revoked in that request.


        Note: user_name and user_username are never reported as a changed
        field on "Update System User" rows - user_username is immutable by
        design, and user_name is no longer part of PATCH /user/:id's
        editable surface, so neither value ever differs between the before
        and after snapshot.


        entity_name is resolved from the user_name value captured in the
        snapshot at the time of the interaction, not from a live lookup -
        so the name shown reflects what it was at that point in time, even
        if the account was later deactivated or its details changed.


        To retrieve the trail for one specific system user only, use
        GET /audit/user/:id.


        Required Permission: IT Manager or IT Supervisor role.
      security:
        - bearerAuth: []
      responses:
        "200":
          description: >
            Audit trail retrieved successfully. Returns a flattened JSON
            array of BizBox-style audit rows across every system user
            account, ordered newest-first. If no user account interactions
            have ever been logged, returns a structured response with an
            empty data array and an informational message.
          content:
            application/json:
              schema:
                oneOf:
                  - type: array
                    items:
                      $ref: "#/components/schemas/AuditTrailEntry"
                  - $ref: "#/components/schemas/EmptyAuditLogResponse"
              examples:
                with_history:
                  summary: System user audit trail with multiple interactions
                  description: >
                    A permission was revoked, then granted, then the
                    account's role was updated, and finally the full
                    creation event for the account is shown - one row per
                    populated field, all sharing the same audit_log_id.
                  value:
                    - audit_log_id: 23
                      entity_name: Maria Santos
                      interaction_date: "2025-06-09T14:00:00.000Z"
                      interaction_type: Revoke Permission
                      user_name: Juan Dela Cruz
                      field: Permissions
                      old_value: "1, 2, 9, 11, 12, 22"
                      new_value: "9, 11, 12, 22"
                      interaction_detail: "Revoked temporary permission(s): [1, 2] from system user: Maria Santos."
                    - audit_log_id: 21
                      entity_name: Maria Santos
                      interaction_date: "2025-06-09T09:00:00.000Z"
                      interaction_type: Grant Permission
                      user_name: Juan Dela Cruz
                      field: Permissions
                      old_value: "9, 11, 12, 22"
                      new_value: "1, 2, 9, 11, 12, 22"
                      interaction_detail: "Granted temporary permission(s): [1, 2] to system user: Maria Santos. Validity: 2025-06-09 09:00:00 to 2025-06-16 09:00:00."
                    - audit_log_id: 20
                      entity_name: Maria Santos
                      interaction_date: "2025-06-08T16:20:00.000Z"
                      interaction_type: Update System User
                      user_name: Juan Dela Cruz
                      field: User Role
                      old_value: IT Helpdesk
                      new_value: IT Supervisor
                      interaction_detail: Updated account details of Maria Santos.
                    - audit_log_id: 6
                      entity_name: Maria Santos
                      interaction_date: "2025-06-08T09:00:00.000Z"
                      interaction_type: Add System User
                      user_name: Juan Dela Cruz
                      field: User Name
                      old_value: null
                      new_value: Maria Santos
                      interaction_detail: "Added System User. Name: Maria Santos Employee ID: 20099."
                    - audit_log_id: 6
                      entity_name: Maria Santos
                      interaction_date: "2025-06-08T09:00:00.000Z"
                      interaction_type: Add System User
                      user_name: Juan Dela Cruz
                      field: User Email
                      old_value: null
                      new_value: msantos@tmcsl.com
                      interaction_detail: "Added System User. Name: Maria Santos Employee ID: 20099."
                    - audit_log_id: 6
                      entity_name: Maria Santos
                      interaction_date: "2025-06-08T09:00:00.000Z"
                      interaction_type: Add System User
                      user_name: Juan Dela Cruz
                      field: User Employee ID
                      old_value: null
                      new_value: "20099"
                      interaction_detail: "Added System User. Name: Maria Santos Employee ID: 20099."
                    - audit_log_id: 6
                      entity_name: Maria Santos
                      interaction_date: "2025-06-08T09:00:00.000Z"
                      interaction_type: Add System User
                      user_name: Juan Dela Cruz
                      field: User Role
                      old_value: null
                      new_value: IT Helpdesk
                      interaction_detail: "Added System User. Name: Maria Santos Employee ID: 20099."
                    - audit_log_id: 6
                      entity_name: Maria Santos
                      interaction_date: "2025-06-08T09:00:00.000Z"
                      interaction_type: Add System User
                      user_name: Juan Dela Cruz
                      field: User Status
                      old_value: null
                      new_value: Active
                      interaction_detail: "Added System User. Name: Maria Santos Employee ID: 20099."
                    - audit_log_id: 6
                      entity_name: Maria Santos
                      interaction_date: "2025-06-08T09:00:00.000Z"
                      interaction_type: Add System User
                      user_name: Juan Dela Cruz
                      field: User Username
                      old_value: null
                      new_value: msantos
                      interaction_detail: "Added System User. Name: Maria Santos Employee ID: 20099."
                no_history:
                  summary: No system user interactions logged
                  description: >
                    No audit log entries exist yet for any system user
                    account. This can also happen if every existing account
                    predates this audit logging being introduced (e.g. was
                    registered before "Add System User" logging was added).
                  value:
                    message: No audit logs found
                    data: []
        "401":
          description: >
            Unauthorized - The request did not include a valid Bearer token,
            or the token has expired or is malformed.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
              examples:
                no_token:
                  summary: No token provided
                  value:
                    message: "Unauthorized Access: No Token Provided"
                invalid_token:
                  summary: Token is invalid or expired
                  value:
                    message: "Unauthorized Access: Invalid Token"
        "403":
          description: >
            Forbidden - The authenticated user does not have the IT Manager or
            IT Supervisor role assigned to their account.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
              examples:
                insufficient_permissions:
                  summary: User lacks the required role
                  value:
                    message: "Forbidden: Insufficient permissions"
        "500":
          description: >
            Internal Server Error - An unexpected error occurred on the server
            while attempting to retrieve the system user audit trail,
            typically due to a database connectivity or query failure.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
              examples:
                server_error:
                  summary: Unexpected server-side failure
                  value:
                    message: Something went wrong

