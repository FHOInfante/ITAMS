  /audit/purchase-request:
    get:
      tags:
        - Audit Logs
      summary: Retrieve the audit trail for all purchase requests and their items
      description: >
        Returns audit trail entries for every interaction that has ever
        targeted a purchase request (target_table = "purchase_request"),
        across every purchase request in the system. Entries are ordered
        newest interaction first.


        Covered interaction types: "Add Purchase Request",
        "Update Purchase Request", "Add Purchase Request Item",
        "Update Purchase Request Item", "Delete Purchase Request Item".


        This single endpoint covers BOTH header-level interactions (creating
        or editing the purchase request itself - pr_status, requested_by,
        received_by, date_received, remarks) AND item-level interactions
        (adding, receiving, or deleting an individual line item). Item-level
        events are logged against their parent purchase request's pr_id
        rather than a separate target_table, so there is no per-item
        endpoint - everything for a given PR, including all of its items'
        history, is returned together here.


        Each entry is a flattened BizBox-style row. "Add Purchase Request"
        and "Add Purchase Request Item" are creation events: they produce
        one row per populated field, with old_value null and new_value set
        to the field's initial value. "Delete Purchase Request Item" is the
        mirror case: it produces one row per field the item held
        immediately before deletion, with new_value null. "Update Purchase
        Request" and "Update Purchase Request Item" produce one row per
        individual field that actually changed between the before and after
        snapshot. An interaction that touched multiple fields will appear as
        multiple rows sharing the same audit_log_id, interaction_date, and
        interaction_type.


        Note: marking a purchase request's pr_status as "Received" (either
        directly, or automatically once its last outstanding item is marked
        received) forces every one of its items to be considered received
        as a side effect. That mass side effect on individual items is not
        separately logged - only the purchase request's own pr_status field
        change is recorded, since it already communicates that every item is
        now settled.


        entity_name is resolved from the pr_no captured in the snapshot at
        the time of the interaction, not from a live lookup, formatted as
        "PR-<pr_no>" for header-level rows. Item-level rows additionally
        include the item's own description, formatted as
        "PR-<pr_no> – <item description>", since a single purchase request
        can have many items and pr_no alone would not identify which one was
        affected.


        Required Permission: IT Manager or IT Supervisor role.
      security:
        - bearerAuth: []
      responses:
        "200":
          description: >
            Audit trail retrieved successfully. Returns a flattened JSON
            array of BizBox-style audit rows across every purchase request
            and its items, ordered newest-first. If no purchase request
            interactions have ever been logged, returns a structured
            response with an empty data array and an informational message.
          content:
            application/json:
              schema:
                oneOf:
                  - type: array
                    items:
                      $ref: "#/components/schemas/AuditTrailEntry"
                  - $ref: "#/components/schemas/EmptyAuditLogResponse"
              examples:
                with_history:
                  summary: Purchase request audit trail with multiple interactions
                  description: >
                    Several purchase request interactions have been logged,
                    including a deleted item (multiple rows, one per field,
                    all with new_value null), an auto-completed PR header
                    (multiple rows sharing one audit_log_id), a single item
                    marked as received, an item added after creation, and
                    the original PR creation (multiple rows, one per
                    populated field).
                  value:
                    - audit_log_id: 14
                      entity_name: "PR-202500045 – Office Chair"
                      interaction_date: "2025-06-09T11:20:00.000Z"
                      interaction_type: Delete Purchase Request Item
                      user_name: Juan Dela Cruz
                      field: Item Description
                      old_value: Office Chair
                      new_value: null
                      interaction_detail: "Deleted item from PR No: 202500045. Item: Office Chair."
                    - audit_log_id: 14
                      entity_name: "PR-202500045 – Office Chair"
                      interaction_date: "2025-06-09T11:20:00.000Z"
                      interaction_type: Delete Purchase Request Item
                      user_name: Juan Dela Cruz
                      field: Item Quantity
                      old_value: "2"
                      new_value: null
                      interaction_detail: "Deleted item from PR No: 202500045. Item: Office Chair."
                    - audit_log_id: 14
                      entity_name: "PR-202500045 – Office Chair"
                      interaction_date: "2025-06-09T11:20:00.000Z"
                      interaction_type: Delete Purchase Request Item
                      user_name: Juan Dela Cruz
                      field: Unit Price
                      old_value: "3500.00"
                      new_value: null
                      interaction_detail: "Deleted item from PR No: 202500045. Item: Office Chair."
                    - audit_log_id: 14
                      entity_name: "PR-202500045 – Office Chair"
                      interaction_date: "2025-06-09T11:20:00.000Z"
                      interaction_type: Delete Purchase Request Item
                      user_name: Juan Dela Cruz
                      field: Is Received
                      old_value: "No"
                      new_value: null
                      interaction_detail: "Deleted item from PR No: 202500045. Item: Office Chair."
                    - audit_log_id: 13
                      entity_name: "PR-202500045"
                      interaction_date: "2025-06-09T10:05:00.000Z"
                      interaction_type: Update Purchase Request
                      user_name: Juan Dela Cruz
                      field: PR Status
                      old_value: In Process
                      new_value: Received
                      interaction_detail: "All items received — Purchase Request auto-completed. PR No: 202500045."
                    - audit_log_id: 13
                      entity_name: "PR-202500045"
                      interaction_date: "2025-06-09T10:05:00.000Z"
                      interaction_type: Update Purchase Request
                      user_name: Juan Dela Cruz
                      field: Date Received
                      old_value: null
                      new_value: "2025-06-09"
                      interaction_detail: "All items received — Purchase Request auto-completed. PR No: 202500045."
                    - audit_log_id: 13
                      entity_name: "PR-202500045"
                      interaction_date: "2025-06-09T10:05:00.000Z"
                      interaction_type: Update Purchase Request
                      user_name: Juan Dela Cruz
                      field: Received By
                      old_value: null
                      new_value: Juan Dela Cruz
                      interaction_detail: "All items received — Purchase Request auto-completed. PR No: 202500045."
                    - audit_log_id: 12
                      entity_name: "PR-202500045 – Laptop Charger"
                      interaction_date: "2025-06-09T10:04:30.000Z"
                      interaction_type: Update Purchase Request Item
                      user_name: Juan Dela Cruz
                      field: Is Received
                      old_value: "No"
                      new_value: "Yes"
                      interaction_detail: "Marked item as received under PR No: 202500045. Item: Laptop Charger."
                    - audit_log_id: 10
                      entity_name: "PR-202500045 – Laptop Charger"
                      interaction_date: "2025-06-08T16:40:00.000Z"
                      interaction_type: Add Purchase Request Item
                      user_name: Maria Santos
                      field: Item Description
                      old_value: null
                      new_value: Laptop Charger
                      interaction_detail: "Added item to PR No: 202500045. Item: Laptop Charger."
                    - audit_log_id: 10
                      entity_name: "PR-202500045 – Laptop Charger"
                      interaction_date: "2025-06-08T16:40:00.000Z"
                      interaction_type: Add Purchase Request Item
                      user_name: Maria Santos
                      field: Item Quantity
                      old_value: null
                      new_value: "5"
                      interaction_detail: "Added item to PR No: 202500045. Item: Laptop Charger."
                    - audit_log_id: 10
                      entity_name: "PR-202500045 – Laptop Charger"
                      interaction_date: "2025-06-08T16:40:00.000Z"
                      interaction_type: Add Purchase Request Item
                      user_name: Maria Santos
                      field: Unit Price
                      old_value: null
                      new_value: "850.00"
                      interaction_detail: "Added item to PR No: 202500045. Item: Laptop Charger."
                    - audit_log_id: 10
                      entity_name: "PR-202500045 – Laptop Charger"
                      interaction_date: "2025-06-08T16:40:00.000Z"
                      interaction_type: Add Purchase Request Item
                      user_name: Maria Santos
                      field: Is Received
                      old_value: null
                      new_value: "No"
                      interaction_detail: "Added item to PR No: 202500045. Item: Laptop Charger."
                    - audit_log_id: 4
                      entity_name: "PR-202500045"
                      interaction_date: "2025-06-08T09:30:00.000Z"
                      interaction_type: Add Purchase Request
                      user_name: Maria Santos
                      field: PR Status
                      old_value: null
                      new_value: In Process
                      interaction_detail: "Added Purchase Request. PR No: 202500045."
                    - audit_log_id: 4
                      entity_name: "PR-202500045"
                      interaction_date: "2025-06-08T09:30:00.000Z"
                      interaction_type: Add Purchase Request
                      user_name: Maria Santos
                      field: Date Requested
                      old_value: null
                      new_value: "2025-06-08"
                      interaction_detail: "Added Purchase Request. PR No: 202500045."
                    - audit_log_id: 4
                      entity_name: "PR-202500045"
                      interaction_date: "2025-06-08T09:30:00.000Z"
                      interaction_type: Add Purchase Request
                      user_name: Maria Santos
                      field: Requested By
                      old_value: null
                      new_value: Maria Santos
                      interaction_detail: "Added Purchase Request. PR No: 202500045."
                no_history:
                  summary: No purchase request interactions logged
                  description: >
                    No audit log entries exist yet for any purchase request
                    or item.
                  value:
                    message: No audit logs found
                    data: []
        "401":
          description: >
            Unauthorized - The request did not include a valid Bearer token,
            or the token has expired or is malformed.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
              examples:
                no_token:
                  summary: No token provided
                  value:
                    message: "Unauthorized Access: No Token Provided"
