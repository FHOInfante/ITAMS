                    message: "Unauthorized Access: No Token Provided"
                invalid_token:
                  summary: Token is invalid or expired
                  value:
                    message: "Unauthorized Access: Invalid Token"
        "403":
          description: >
            Forbidden - The authenticated user does not have the IT Manager or
            IT Supervisor role assigned to their account.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
              examples:
                insufficient_permissions:
                  summary: User lacks the required role
                  value:
                    message: "Forbidden: Insufficient permissions"
        "500":
          description: >
            Internal Server Error - An unexpected error occurred on the server
            while attempting to retrieve the system user audit history,
            typically due to a database connectivity or query failure.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
              examples:
                server_error:
                  summary: Unexpected server-side failure
                  value:
                    message: Something went wrong

  /audit/end-user:
    get:
      tags:
        - Audit Logs
      summary: Retrieve the audit trail for all end users
      description: >
        Returns audit trail entries for every interaction that has ever
        targeted an end user record (target_table = "end_user"), across
        every end user in the system. Entries are ordered newest
        interaction first.


        Covered interaction types: "Add End User", "Update End User".


        An end user can be created through TWO separate paths, and both are
        logged identically here under "Add End User": (1) the dedicated
        POST /end-user registration endpoint, and (2) silent
        auto-registration through asset assignment - e.g. assigning a
        computer or software license to an employee ID that has no
        existing end_user record yet, which registers that employee as an
        end user as a side effect. The interaction_detail text is the only
        way to tell the two apart after the fact ("Added End User.
        Employee ID: ..." for the dedicated endpoint, vs. "Added End User
        via asset assignment. Employee ID: ..." for the asset-assignment
        path) - the interaction_type, target_table, and snapshot shape are
        otherwise identical.


        Each entry is a flattened BizBox-style row. "Add End User" is a
        creation event: it produces one row per populated field on the new
        end user (End User Name, End User Emp ID, End User Division, End
        User Department, End User Location, and optionally End User Email
        / End User Contact No if supplied), with old_value null and
        new_value set to the field's initial value - End User Status is
        always included and always defaults to "Active" at creation, since
        the database column defaults to "Active" and neither creation path
        accepts a status override. "Update End User" produces one row per
        individual field that actually changed between the before and
        after snapshot - this covers both edits made via PATCH
        /end-user/:id (name, division, department, location, email,
        contact number, and/or status together) and status-only changes
        made via the dedicated end user status endpoint, since both log
        under this same interaction_type and target_table. An update that
        touched multiple fields will appear as multiple rows sharing the
        same audit_log_id.


        End User Department is stored and reported as the numeric
        department_id foreign key, not the resolved department name -
        resolve it against GET /department if a human-readable name is
        needed.


        entity_name is resolved from the eu_name value captured in the
        snapshot at the time of the interaction, not from a live lookup -
        so the name shown reflects what it was at that point in time, even
        if the end user's name was later changed or their status set to
        Resigned.


        To retrieve the trail for one specific end user only, use
        GET /audit/end-user/:id.


        Required Permission: IT Manager or IT Supervisor role.
      security:
        - bearerAuth: []
      responses:
        "200":
          description: >
            Audit trail retrieved successfully. Returns a flattened JSON
            array of BizBox-style audit rows across every end user, ordered
            newest-first. If no end user interactions have ever been
            logged, returns a structured response with an empty data array
            and an informational message.
          content:
            application/json:
              schema:
                oneOf:
                  - type: array
                    items:
                      $ref: "#/components/schemas/AuditTrailEntry"
                  - $ref: "#/components/schemas/EmptyAuditLogResponse"
              examples:
                with_history:
                  summary: End user audit trail with multiple interactions
                  description: >
                    One end user's status was updated to Resigned, another
                    end user was auto-registered through asset assignment
                    (no dedicated registration call was ever made for
                    them), and finally the full creation event for a third
                    end user - added through the dedicated endpoint - is
                    shown as one row per populated field, all sharing the
                    same audit_log_id.
                  value:
                    - audit_log_id: 33
                      entity_name: Carlos Reyes
                      interaction_date: "2025-06-10T11:00:00.000Z"
                      interaction_type: Update End User
                      user_name: Juan Dela Cruz
                      field: End User Status
                      old_value: Active
                      new_value: Resigned
                      interaction_detail: "Updated status of end user: Carlos Reyes to Resigned."
                    - audit_log_id: 29
                      entity_name: Ana Villareal
                      interaction_date: "2025-06-09T15:30:00.000Z"
                      interaction_type: Add End User
                      user_name: Maria Santos
                      field: End User Name
                      old_value: null
                      new_value: Ana Villareal
                      interaction_detail: "Added End User via asset assignment. Employee ID: 20045 Name: Ana Villareal."
                    - audit_log_id: 29
                      entity_name: Ana Villareal
                      interaction_date: "2025-06-09T15:30:00.000Z"
                      interaction_type: Add End User
                      user_name: Maria Santos
                      field: End User Emp ID
                      old_value: null
                      new_value: "20045"
                      interaction_detail: "Added End User via asset assignment. Employee ID: 20045 Name: Ana Villareal."
                    - audit_log_id: 29
                      entity_name: Ana Villareal
                      interaction_date: "2025-06-09T15:30:00.000Z"
                      interaction_type: Add End User
                      user_name: Maria Santos
                      field: End User Status
                      old_value: null
                      new_value: Active
                      interaction_detail: "Added End User via asset assignment. Employee ID: 20045 Name: Ana Villareal."
                    - audit_log_id: 8
                      entity_name: Maria Lopez
                      interaction_date: "2025-06-08T14:10:00.000Z"
                      interaction_type: Add End User
                      user_name: Juan Dela Cruz
                      field: End User Name
                      old_value: null
                      new_value: Maria Lopez
                      interaction_detail: "Added End User. Employee ID: 20099 Name: Maria Lopez."
                    - audit_log_id: 8
                      entity_name: Maria Lopez
                      interaction_date: "2025-06-08T14:10:00.000Z"
                      interaction_type: Add End User
                      user_name: Juan Dela Cruz
                      field: End User Emp ID
                      old_value: null
                      new_value: "20099"
                      interaction_detail: "Added End User. Employee ID: 20099 Name: Maria Lopez."
                    - audit_log_id: 8
                      entity_name: Maria Lopez
                      interaction_date: "2025-06-08T14:10:00.000Z"
                      interaction_type: Add End User
                      user_name: Juan Dela Cruz
                      field: End User Division
                      old_value: null
                      new_value: Finance
                      interaction_detail: "Added End User. Employee ID: 20099 Name: Maria Lopez."
                    - audit_log_id: 8
                      entity_name: Maria Lopez
                      interaction_date: "2025-06-08T14:10:00.000Z"
                      interaction_type: Add End User
                      user_name: Juan Dela Cruz
                      field: End User Department
                      old_value: null
                      new_value: "3"
                      interaction_detail: "Added End User. Employee ID: 20099 Name: Maria Lopez."
                    - audit_log_id: 8
                      entity_name: Maria Lopez
                      interaction_date: "2025-06-08T14:10:00.000Z"
                      interaction_type: Add End User
                      user_name: Juan Dela Cruz
                      field: End User Location
                      old_value: null
                      new_value: 3F
                      interaction_detail: "Added End User. Employee ID: 20099 Name: Maria Lopez."
                    - audit_log_id: 8
                      entity_name: Maria Lopez
                      interaction_date: "2025-06-08T14:10:00.000Z"
                      interaction_type: Add End User
                      user_name: Juan Dela Cruz
                      field: End User Email
                      old_value: null
                      new_value: mlopez@tmcsl.com
                      interaction_detail: "Added End User. Employee ID: 20099 Name: Maria Lopez."
                    - audit_log_id: 8
                      entity_name: Maria Lopez
                      interaction_date: "2025-06-08T14:10:00.000Z"
                      interaction_type: Add End User
                      user_name: Juan Dela Cruz
                      field: End User Contact No
                      old_value: null
                      new_value: "09171234567"
                      interaction_detail: "Added End User. Employee ID: 20099 Name: Maria Lopez."
                    - audit_log_id: 8
                      entity_name: Maria Lopez
                      interaction_date: "2025-06-08T14:10:00.000Z"
                      interaction_type: Add End User
                      user_name: Juan Dela Cruz
                      field: End User Status
                      old_value: null
                      new_value: Active
                      interaction_detail: "Added End User. Employee ID: 20099 Name: Maria Lopez."
                no_history:
                  summary: No end user interactions logged
                  description: >
                    No audit log entries exist yet for any end user. This
                    can also happen if every existing end user record
                    predates this audit logging being introduced (e.g. was
                    added before end_user snapshotting was retrofitted).
                  value:
                    message: No audit logs found
                    data: []
        "401":
          description: >
            Unauthorized - The request did not include a valid Bearer token,
            or the token has expired or is malformed.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
              examples:
                no_token:
                  summary: No token provided
                  value:
                    message: "Unauthorized Access: No Token Provided"
                invalid_token:
                  summary: Token is invalid or expired
                  value:
                    message: "Unauthorized Access: Invalid Token"
        "403":
          description: >
            Forbidden - The authenticated user does not have the IT Manager or
            IT Supervisor role assigned to their account.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
              examples:
                insufficient_permissions:
                  summary: User lacks the required role
                  value:
                    message: "Forbidden: Insufficient permissions"
        "500":
          description: >
            Internal Server Error - An unexpected error occurred on the server
            while attempting to retrieve the end user audit trail,
            typically due to a database connectivity or query failure.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
              examples:
                server_error:
                  summary: Unexpected server-side failure
                  value:
                    message: Something went wrong

  "/audit/end-user/:id":
    get:
      tags:
        - Audit Logs
      summary: Retrieve the full audit history for one specific end user
      description: >
        Returns all audit trail entries that reference a single end user
        record, identified by the given eu_id and matched via the
        target_table and target_id columns. Entries are ordered newest
        interaction first.


        This covers every tracked interaction that has ever targeted this
        specific end user, including its creation ("Add End User" - via
        either the dedicated registration endpoint or auto-registration
        through asset assignment) and every subsequent edit
        ("Update End User").


        Each entry is a flattened BizBox-style row. The creation event
        produces one row per populated field, with field/old_value/new_value
        set the same way as GET /audit/end-user. All other interaction
        types produce one row per individual field that changed - an
        interaction that changed multiple fields will appear as multiple
        rows sharing the same audit_log_id.


        Required Permission: IT Manager or IT Supervisor role.
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          description: >
            The eu_id (primary key of the end_user table) of the end user
            whose audit history is to be retrieved. Must be a positive
            integer.
          schema:
            type: integer
            example: 8
      responses:
        "200":
          description: >
            Audit history retrieved successfully. Returns a flattened JSON
            array of BizBox-style audit rows for the specified end user,
            ordered newest-first. If no entries exist for the given eu_id
            (e.g., the end user record predates audit logging, or the ID
            does not correspond to any tracked record), returns a
            structured response with an empty data array and an
            informational message.
          content:
            application/json:
              schema:
                oneOf:
                  - type: array
                    items:
                      $ref: "#/components/schemas/AuditTrailEntry"
                  - $ref: "#/components/schemas/EmptyAssetAuditLogResponse"
              examples:
                single_record_history:
                  summary: End user has audit trail entries
                  description: >
                    The end user with ID 8 was added, then later had a
                    single field updated.
                  value:
                    - audit_log_id: 33
                      entity_name: Maria Lopez
                      interaction_date: "2025-06-10T11:00:00.000Z"
                      interaction_type: Update End User
                      user_name: Juan Dela Cruz
                      field: End User Location
                      old_value: 3F
                      new_value: 2F
                      interaction_detail: "Updated details of end user: Maria Lopez."
                    - audit_log_id: 8
                      entity_name: Maria Lopez
                      interaction_date: "2025-06-08T14:10:00.000Z"
                      interaction_type: Add End User
                      user_name: Juan Dela Cruz
                      field: End User Name
                      old_value: null
                      new_value: Maria Lopez
                      interaction_detail: "Added End User. Employee ID: 20099 Name: Maria Lopez."
                    - audit_log_id: 8
                      entity_name: Maria Lopez
                      interaction_date: "2025-06-08T14:10:00.000Z"
                      interaction_type: Add End User
                      user_name: Juan Dela Cruz
                      field: End User Emp ID
                      old_value: null
                      new_value: "20099"
                      interaction_detail: "Added End User. Employee ID: 20099 Name: Maria Lopez."
                no_history:
                  summary: No audit trail entries found for this end user
                  description: >
                    The eu_id is valid but no audit log entries reference
                    it. This can occur for end user records that existed
                    before audit logging was introduced.
                  value:
                    message: No audit logs found for this asset
                    data: []
        "400":
          description: >
            Bad Request - The provided id path parameter is missing or is not
            a valid positive integer.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
              examples:
                missing_id:
                  summary: The end user ID is zero or not a valid integer
                  value:
                    message: Missing asset ID
        "401":
          description: >
            Unauthorized - The request did not include a valid Bearer token,
            or the token has expired or is malformed.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
              examples:
                no_token:
                  summary: No token provided
                  value:
                    message: "Unauthorized Access: No Token Provided"
                invalid_token:
                  summary: Token is invalid or expired
                  value:
                    message: "Unauthorized Access: Invalid Token"
        "403":
          description: >
            Forbidden - The authenticated user does not have the IT Manager or
            IT Supervisor role assigned to their account.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
              examples:
                insufficient_permissions:
                  summary: User lacks the required role
                  value:
                    message: "Forbidden: Insufficient permissions"
        "500":
          description: >
            Internal Server Error - An unexpected error occurred on the server
            while attempting to retrieve the end user audit history,
            typically due to a database connectivity or query failure.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
              examples:
                server_error:
                  summary: Unexpected server-side failure
                  value:
                    message: Something went wrong

components:
  schemas:
    AuditTrailEntry:
      type: object
      description: >
        A single flattened, BizBox-style audit trail row. Unlike the raw
        audit_log table structure, one underlying audit_log record can expand
        into multiple AuditTrailEntry rows - one per field that was actually
        changed - so that each row represents exactly one Field / Old Value /
        New Value fact. Rows produced from the same underlying interaction
        share the same audit_log_id, interaction_date, interaction_type,
        user_name, and interaction_detail.


        For interactions with no discrete field-level change to report -
        asset creation events and every system-level (non-asset) interaction
        type - a single row is returned with field, old_value, and new_value
        all set to null. In that case, interaction_detail is the primary
        source of context for what occurred.
      properties:
        audit_log_id:
          type: integer
          description: >
            The audit_log_id of the underlying audit_log record this row was
            derived from. NOT NULL. Multiple AuditTrailEntry rows may share
            the same audit_log_id when a single interaction changed more than
            one field.
          example: 9
        entity_name:
          type: string
          nullable: true
          description: >
            The human-readable name or identifier of the affected asset or
            purchase request, resolved from the snapshot captured at the
            time of the interaction rather than a live lookup.


            For asset types, this is the relevant name column
            (computer_name, software_name, printer_name, and
            network_device_name for their respective asset types; serial_no
            for UPS, since the ups table has no dedicated name column). For
            purchase requests, this is "PR-<pr_no>" for header-level
            interactions, or "PR-<pr_no> – <item description>" for
            item-level interactions (Add/Update/Delete Purchase Request
            Item), since a single purchase request can have many items. For
            system user interactions (target_table = "user"), this is the
            affected account's user_name. For end user interactions
            (target_table = "end_user"), this is the affected end user's
            eu_name.


            Always null for system-level (non-asset) interactions, since
            target_table is null in that case.
          example: DESKTOP-IT-012
        interaction_date:
          type: string
          format: date-time
          description: >
            Timestamp of when the underlying interaction occurred. NOT NULL.
            Returned in ISO 8601 format by the API.
          example: "2025-06-08T15:00:00.000Z"
        interaction_type:
          type: string
          description: >
            A short label categorizing the type of system action that was
            performed. NOT NULL. This value is set programmatically by the
            backend at the time the log is created. It is not an ENUM in the
            database, so values may vary. When using the type filter on
            GET /audit/system, the value supplied must match this field
            exactly, including casing.


            Asset interaction types that can produce field-level rows
            (including creation events, which always produce a single
            null-field row): "Add Computer", "Update Computer",
            "Assign Computer", "Unassign Computer", "Update Computer Network",
            "Add Software", "Update Software", "Assign Software",
            "Unassign Software", "Add Printer", "Update Printer",
            "Update Printer Network", "Add UPS", "Update UPS",
            "Add Network Device", "Update Network Device".


            Purchase-request interaction types - logged with target_table =
            "purchase_request" so they carry an entity_name, and can produce
            field-level rows the same way asset types do (creation and
            deletion events always produce at least one row per populated
            field): "Add Purchase Request", "Update Purchase Request",
            "Add Purchase Request Item", "Update Purchase Request Item",
            "Delete Purchase Request Item".


            System user interaction types - logged with target_table =
            "user" so they carry an entity_name (the affected system user's
            name), and can produce field-level rows the same way asset
            types do: "Add System User" (creation - one row per populated
            field), "Update System User" (one row per field that actually
            changed among user_email/user_role/user_status), and "Grant
            Permission"/"Revoke Permission" (always a single synthetic
            "Permissions" field row, whose old_value/new_value are the
            user's full held permission_id set before/after the change, not
            just the ones granted/revoked in that request).


            End user interaction types - logged with target_table =
            "end_user" so they carry an entity_name (the affected end
            user's eu_name), and can produce field-level rows the same way
            asset types do: "Add End User" (creation - one row per
            populated field; produced both by the dedicated POST /end-user
            endpoint and by silent auto-registration through asset
            assignment) and "Update End User" (one row per field that
            actually changed, including eu_status - PATCH /end-user/:id
            and the dedicated status-update endpoint both log under this
            same interaction_type).


            System-level interaction types, which always produce a single
            null-field row: "Login", "Change Password", "Add Department",
            "Update Department", "Add Peripheral", "Update Peripheral",
            "Add Program", "Update Program", "Add Vendor", "Update Vendor",
            "Add Category", "Update Category Status",
            "Download Computer Report", "Download Software Report",
            "Download UPS Report", "Download Printer Report",
            "Download Network Device Report", "Download End User Report".
          example: Update Computer
        user_name:
          type: string
          description: >
            The full name of the authenticated system user (the actor) who
            performed the interaction. NOT NULL. Resolved via a join against
            the user table on the audit_log's user_id.
          example: Juan Dela Cruz
        field:
          type: string
          nullable: true
          description: >
            The humanized label of the specific field that was changed by
            this interaction (e.g., "ip_address" is rendered as "IP Address").
            Null when the interaction is an asset creation event or any
            system-level interaction, since there is no discrete before/after
            field pairing to report in those cases - refer to
            interaction_detail instead. The primary key column of the
            affected asset table is never reported as a field, even if it
            technically differs between snapshots.
          example: Computer Status
        old_value:
          type: string
          nullable: true
          description: >
            The value of field immediately before the change was applied,
            taken from the stored snapshot_before. Null when field is null
            (creation or system-level events), or when the field genuinely
            had no prior value (e.g., an unassigned field being set for the
            first time). Pipe-delimited multi-value fields (such as assigned
            peripherals or programs) are rendered as a comma-separated list.
          example: Spare
        new_value:
          type: string
          nullable: true
          description: >
            The value of field immediately after the change was applied,
            taken from the stored snapshot_after. Null only when field is
            null (creation or system-level events) and the field itself has
            no value in the newly created record. Pipe-delimited multi-value
            fields (such as assigned peripherals or programs) are rendered as
            a comma-separated list.
          example: Active
        interaction_detail:
          type: string
          description: >
            A human-readable description of exactly what was performed during
            the interaction. NOT NULL. Written by the backend at the point the
            audit log is created, providing full context such as which record
            was affected. This is the primary source of context for
            interactions where field, old_value, and new_value are null.
          example: Updated details of DESKTOP-IT-012.

    EmptyAuditLogResponse:
      type: object
      description: >
        Returned when no audit log records match the request - either because
        the underlying data set is empty (no filter applied, or no
        interactions have ever been logged for the given scope) or because no
        entries match the supplied type filter(s) on GET /audit/system. The
        request was fully authorized and processed; there is simply no data
        to return.
      properties:
        message:
          type: string
          example: No audit logs found
        data:
          type: array
          items: {}
          example: []

    EmptyAssetAuditLogResponse:
      type: object
      description: >
        Returned by the per-record audit history endpoints (e.g.
        GET /audit/computer/:id) when no audit log entries reference the
        specified asset record. This can occur for records that existed
        before audit logging was introduced, or for a valid ID with no
        tracked events. The request was fully authorized and processed;
        there is simply no data to return.
      properties:
        message:
          type: string
          example: No audit logs found for this asset
        data:
          type: array
          items: {}
          example: []

    ErrorResponse:
      type: object
      description: Standard error response shape returned by all error paths in this API.
      properties:
        message:
          type: string
          description: A human-readable explanation of why the request failed.
          example: Something went wrong
