                insufficient_permissions:
                  summary: User lacks the required role
                  value:
                    message: "Forbidden: Insufficient permissions"
        "500":
          description: >
            Internal Server Error - An unexpected error occurred on the server
            while attempting to retrieve the purchase request audit trail,
            typically due to a database connectivity or query failure.
          content:
