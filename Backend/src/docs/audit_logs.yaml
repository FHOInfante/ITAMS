paths:
  /audit/system:
    get:
      tags:
        - Audit Logs
      summary: Retrieve the system-level (non-asset) audit trail, optionally filtered by interaction type
      description: >
        Returns audit trail entries for interactions that are not tied to a specific
        asset record (target_table is null) - authentication events, end user
        management, purchase request management, report generation, and file
        maintenance actions on reference data (Category, Vendor, Department,
        Peripheral, and Program).


        Covered interaction types: "Login", "Change Password",
        "Add Department", "Update Department", "Add Peripheral",
        "Update Peripheral", "Add Program", "Update Program", "Add Vendor",
        "Update Vendor", "Add Category", "Update Category Status",
        "Download Computer Report", "Download Software Report",
        "Download UPS Report", "Download Printer Report",
        "Download Network Device Report", "Download End User Report".


        NOTE: End user interactions ("Add End User", "Update End User") are
        NOT covered here, despite end users not being an "asset" in the
        traditional sense - they are logged with target_table = "end_user"
        so their audit trail can carry an entity_name (the affected end
        user's name) and field-level Old Value/New Value rows, the same way
        every other asset type does. This includes end users created via
        POST /end-user AND end users silently auto-registered through asset
        assignment (e.g. assigning a computer to an employee ID with no
        existing end_user record) - both paths log identically under
        "Add End User". Use GET /audit/end-user for those instead.


        NOTE: Purchase request interactions ("Add Purchase Request",
        "Update Purchase Request", "Add/Update/Delete Purchase Request Item")
        are NOT covered here despite being non-asset in a business sense -
        they are logged with target_table = "purchase_request" so their
        audit trail can carry an entity_name (PR number and, for item-level
        events, the item description). Use GET /audit/purchase-request for
        those instead.


        NOTE: System user interactions ("Add System User", "Update System
        User", "Grant Permission", "Revoke Permission") are also NOT covered
        here, for the same reason - they are logged with target_table =
        "user" so their audit trail can carry an entity_name (the affected
        system user's name) and, where applicable, field-level Old
        Value/New Value rows. Use GET /audit/user for those instead.


        Each entry in the response is a single flattened row rather than a raw
        database record. Because these interactions carry no before/after
        snapshot, the field, old_value, and new_value properties are always
        null and entity_name is always null - the full context of what changed
        is carried in interaction_detail instead.


        Filtering by Type: The optional "type" query parameter accepts one or
        more interaction type values from the list above. Repeat the parameter
        for each value you want to include, for example "?type=Login&type=Register".
        The filter is case-sensitive and must match the exact string stored in
        the interaction_type column. Values with spaces are supported -
        URL-encode them as %20 (e.g., "?type=Add%20Vendor"). When "type" is
        omitted entirely, all system-level logs are returned without filtering.
        If "type" is supplied but all provided values are empty or
        whitespace-only, the request is rejected with 400 Bad Request.


        Required Permission: IT Manager or IT Supervisor role.
      security:
        - bearerAuth: []
      parameters:
        - name: type
          in: query
          required: false
          description: >
            Filter the system audit trail by one or more interaction type
            values. Repeat this parameter for each type you want to include.
            The value is matched case-sensitively against the interaction_type
            column, so casing must be exact (e.g., "Add Vendor", not
            "add vendor"). Values containing spaces must be URL-encoded
            (e.g., "Add%20Vendor"). If this parameter is provided, only
            log entries whose interaction_type exactly matches one of the
            supplied values are returned. Omit the parameter entirely to
            retrieve every system-level interaction type.
          schema:
            type: array
            items:
              type: string
            example:
              - Login
              - Add Vendor
          style: form
          explode: true
      responses:
        "200":
          description: >
            System audit trail retrieved successfully. Returns a flattened JSON
            array of BizBox-style audit rows, ordered newest interaction first.
            Every row has field, old_value, new_value, and entity_name set to
            null, since system-level interactions carry no asset snapshot. If
            no logs match the given filter (or the underlying data set is
            empty when no filter is applied), returns a structured response
            with an empty data array and an informational message.
          content:
            application/json:
              schema:
                oneOf:
                  - type: array
                    items:
                      $ref: "#/components/schemas/AuditTrailEntry"
                  - $ref: "#/components/schemas/EmptyAuditLogResponse"
              examples:
                no_filter:
                  summary: No type filter - all system-level logs returned
                  description: >
                    Request sent without any type query parameter. All
                    system-level audit rows are returned, sorted newest-first.
                    entity_name, field, old_value, and new_value are null on
                    every row.
                  value:
                    - audit_log_id: 8
                      entity_name: null
                      interaction_date: "2025-06-08T14:10:00.000Z"
                      interaction_type: Add Vendor
                      user_name: Juan Dela Cruz
                      field: null
                      old_value: null
                      new_value: null
                      interaction_detail: Added vendor "HP Development Company, L.P.".
                    - audit_log_id: 7
                      entity_name: null
                      interaction_date: "2025-06-08T13:45:00.000Z"
                      interaction_type: Change Password
                      user_name: Juan Dela Cruz
                      field: null
                      old_value: null
                      new_value: null
                      interaction_detail: Juan Dela Cruz changed their password.
                    - audit_log_id: 6
                      entity_name: null
                      interaction_date: "2025-06-08T13:00:00.000Z"
                      interaction_type: Download Computer Report
                      user_name: Maria Santos
                      field: null
                      old_value: null
                      new_value: null
                      interaction_detail: Downloaded computer report with 8 selected columns.
                    - audit_log_id: 1
                      entity_name: null
                      interaction_date: "2025-06-08T09:15:00.000Z"
                      interaction_type: Login
                      user_name: Juan Dela Cruz
                      field: null
                      old_value: null
                      new_value: null
                      interaction_detail: 10001 logged in.
                single_type_filter:
                  summary: Single type filter - ?type=Login
                  description: >
                    Request sent with a single type value. Only log entries
                    whose interaction_type exactly matches "Login" are returned.
                  value:
                    - audit_log_id: 1
                      entity_name: null
                      interaction_date: "2025-06-08T09:15:00.000Z"
                      interaction_type: Login
                      user_name: Juan Dela Cruz
                      field: null
                      old_value: null
                      new_value: null
                      interaction_detail: 10001 logged in.
                multiple_type_filter:
                  summary: Multiple type filters - ?type=Add Vendor&type=Add Category
                  description: >
                    Request sent with two type values using repeated query
                    parameters. Only log entries whose interaction_type is
                    either "Add Vendor" or "Add Category" are returned,
                    sorted newest-first.
                  value:
                    - audit_log_id: 5
                      entity_name: null
                      interaction_date: "2025-06-08T12:30:00.000Z"
                      interaction_type: Add Category
                      user_name: Maria Santos
                      field: null
                      old_value: null
                      new_value: null
                      interaction_detail: Added category value "Laptop" under group computer.device_type.
                    - audit_log_id: 2
                      entity_name: null
                      interaction_date: "2025-06-08T10:00:00.000Z"
                      interaction_type: Add Vendor
                      user_name: Juan Dela Cruz
                      field: null
                      old_value: null
                      new_value: null
                      interaction_detail: Added vendor "Dell Technologies Inc.".
                no_matching_logs:
                  summary: Valid filter but no matching records
                  description: >
                    The request was fully authorized and the type filter was
                    valid, but no audit log entries matched the specified
                    interaction_type value(s). Also returned when there are no
                    system-level logs at all and no filter is applied.
                  value:
                    message: No audit logs found
                    data: []
        "400":
          description: >
            Bad Request - The type query parameter was provided but resolved
            to no usable values after trimming - for example, "?type=" or
            "?type=%20". This response is only returned when type is
            explicitly supplied and empty; omitting the parameter entirely is
            valid and returns all system-level logs.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
              examples:
                empty_type:
                  summary: The type parameter is blank or whitespace-only
                  description: >
                    The type parameter was included in the query string but
                    the value was empty or contained only whitespace. At least
                    one non-empty type value is required when the parameter is
                    present.
                  value:
                    message: "Invalid query: 'type' must not be empty"
        "401":
          description: >
            Unauthorized - The request did not include a valid Bearer token,
            or the token has expired or is malformed.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
              examples:
                no_token:
                  summary: No token provided
                  description: The Authorization header is missing or does not begin with "Bearer".
                  value:
                    message: "Unauthorized Access: No Token Provided"
                invalid_token:
                  summary: Token is invalid or expired
                  description: The token was provided but failed JWT verification.
                  value:
                    message: "Unauthorized Access: Invalid Token"
        "403":
          description: >
            Forbidden - The authenticated user does not have the IT Manager or
            IT Supervisor role assigned to their account.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
              examples:
                insufficient_permissions:
                  summary: User lacks the required role
                  description: >
                    The token was valid and the user is authenticated, but
                    their role is not IT Manager or IT Supervisor.
                  value:
                    message: "Forbidden: Insufficient permissions"
        "500":
          description: >
            Internal Server Error - An unexpected error occurred on the server
            while attempting to retrieve the system audit trail, typically due
            to a database connectivity or query failure.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
              examples:
                server_error:
                  summary: Unexpected server-side failure
                  value:
                    message: Something went wrong

  /audit/computer:
    get:
      tags:
        - Audit Logs
      summary: Retrieve the audit trail for all computer records
      description: >
        Returns audit trail entries for every interaction that has ever
        targeted a computer record (target_table = "computer"),
        across every computer in the system. Entries are ordered
        newest interaction first.


        Covered interaction types: "Add Computer", "Update Computer", "Assign Computer", "Unassign Computer", "Update Computer Network".


        Each entry is a flattened BizBox-style row. Creation events
        ("Add Computer") produce a single row per interaction with
        field, old_value, and new_value set to null, since there is no prior
        state to compare against - refer to interaction_detail for what was
        added. All other interaction types produce one row per individual
        field that changed between the before and after snapshot; an
        interaction that changed multiple fields will appear as multiple
        rows sharing the same audit_log_id, interaction_date, and
        interaction_type.


        entity_name is resolved from the computer_name value captured in
        the snapshot at the time of the interaction, not from a
        live lookup - so the name shown reflects what it was called at that
        point in time, even if it was later renamed.


        To retrieve the trail for one specific computer only, use
        GET /audit/computer/:id.


        Required Permission: IT Manager or IT Supervisor role.
      security:
        - bearerAuth: []
      responses:
        "200":
          description: >
            Audit trail retrieved successfully. Returns a flattened JSON array
            of BizBox-style audit rows across every computer
            record, ordered newest-first. If no computer
            interactions have ever been logged, returns a structured response
            with an empty data array and an informational message.
          content:
            application/json:
              schema:
                oneOf:
                  - type: array
                    items:
                      $ref: "#/components/schemas/AuditTrailEntry"
                  - $ref: "#/components/schemas/EmptyAuditLogResponse"
              examples:
                with_history:
                  summary: Computer audit trail with multiple interactions
                  description: >
                    Several computer interactions have been logged
                    across the system, including a multi-field update that
                    produced two separate rows sharing the same audit_log_id.
                  value:
                    - audit_log_id: 9
                      entity_name: DESKTOP-IT-012
                      interaction_date: "2025-06-08T15:00:00.000Z"
                      interaction_type: Update Computer
                      user_name: Juan Dela Cruz
                      field: Computer Status
                      old_value: Spare
                      new_value: Active
                      interaction_detail: Updated details of DESKTOP-IT-012.
                    - audit_log_id: 9
                      entity_name: DESKTOP-IT-012
                      interaction_date: "2025-06-08T15:00:00.000Z"
                      interaction_type: Update Computer
                      user_name: Juan Dela Cruz
                      field: IP Address
                      old_value: 192.168.1.45
                      new_value: 192.168.1.60
                      interaction_detail: Updated details of DESKTOP-IT-012.
                    - audit_log_id: 3
                      entity_name: DESKTOP-IT-012
                      interaction_date: "2025-06-08T10:30:00.000Z"
                      interaction_type: Assign Computer
                      user_name: Maria Santos
                      field: Assigned User
                      old_value: null
                      new_value: "20045"
                      interaction_detail: "Assigned an end user for DESKTOP-IT-012. Employee ID: 20045."
                    - audit_log_id: 2
                      entity_name: DESKTOP-IT-012
                      interaction_date: "2025-06-08T09:00:00.000Z"
                      interaction_type: Add Computer
                      user_name: Juan Dela Cruz
                      field: null
                      old_value: null
                      new_value: null
                      interaction_detail: "Added Computer. Computer name: DESKTOP-IT-012 Serial No: SN-2024-0012."
                no_history:
                  summary: No computer interactions logged
                  description: >
                    No audit log entries exist yet for any computer
                    record.
                  value:
                    message: No audit logs found
                    data: []
        "401":
          description: >
            Unauthorized - The request did not include a valid Bearer token,
            or the token has expired or is malformed.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
              examples:
                no_token:
                  summary: No token provided
                  value:
                    message: "Unauthorized Access: No Token Provided"
                invalid_token:
                  summary: Token is invalid or expired
                  value:
                    message: "Unauthorized Access: Invalid Token"
        "403":
          description: >
            Forbidden - The authenticated user does not have the IT Manager or
            IT Supervisor role assigned to their account.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
              examples:
                insufficient_permissions:
                  summary: User lacks the required role
                  value:
                    message: "Forbidden: Insufficient permissions"
        "500":
          description: >
            Internal Server Error - An unexpected error occurred on the server
            while attempting to retrieve the computer audit trail,
            typically due to a database connectivity or query failure.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
              examples:
                server_error:
                  summary: Unexpected server-side failure
                  value:
                    message: Something went wrong

  "/audit/computer/:id":
    get:
      tags:
        - Audit Logs
      summary: Retrieve the full audit history for one specific computer
      description: >
        Returns all audit trail entries that reference a single
        computer record, identified by the given computer_id
        and matched via the target_table and target_id columns. Entries are
        ordered newest interaction first.


        This covers every tracked interaction that has ever targeted this
        specific computer, including its creation
        ("Add Computer") and every subsequent edit
        ("Update Computer", "Assign Computer", "Unassign Computer", "Update Computer Network").


        Each entry is a flattened BizBox-style row. Creation events produce a
        single row with field, old_value, and new_value set to null. All
        other interaction types produce one row per individual field that
        changed - an interaction that changed multiple fields will appear as
        multiple rows sharing the same audit_log_id.


        Required Permission: IT Manager or IT Supervisor role.
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          description: >
            The computer_id (primary key of the computer table) of the
            computer whose audit history is to be retrieved. Must
            be a positive integer.
          schema:
            type: integer
            example: 12
      responses:
        "200":
          description: >
            Audit history retrieved successfully. Returns a flattened JSON
            array of BizBox-style audit rows for the specified
            computer, ordered newest-first. If no entries exist
            for the given computer_id (e.g., the record was added before
            audit logging was in place, or the ID does not correspond to any
            tracked record), returns a structured response with an empty data
            array and an informational message.
          content:
            application/json:
              schema:
                oneOf:
                  - type: array
                    items:
                      $ref: "#/components/schemas/AuditTrailEntry"
                  - $ref: "#/components/schemas/EmptyAssetAuditLogResponse"
              examples:
                single_record_history:
                  summary: Computer has audit trail entries
                  description: >
                    The computer with ID 12 was
                    added, then later had a single field updated.
                  value:
                    - audit_log_id: 3
                      entity_name: DESKTOP-IT-012
                      interaction_date: "2025-06-08T10:30:00.000Z"
                      interaction_type: Assign Computer
                      user_name: Maria Santos
                      field: Assigned User
                      old_value: null
                      new_value: "20045"
                      interaction_detail: "Assigned an end user for DESKTOP-IT-012. Employee ID: 20045."
                    - audit_log_id: 2
                      entity_name: DESKTOP-IT-012
                      interaction_date: "2025-06-08T09:00:00.000Z"
                      interaction_type: Add Computer
                      user_name: Juan Dela Cruz
                      field: null
                      old_value: null
                      new_value: null
                      interaction_detail: "Added Computer. Computer name: DESKTOP-IT-012 Serial No: SN-2024-0012."
                no_history:
                  summary: No audit trail entries found for this computer
                  description: >
                    The computer_id is valid but no audit log entries
                    reference it. This can occur for records that existed
                    before audit logging was introduced.
                  value:
                    message: No audit logs found for this asset
                    data: []
        "400":
          description: >
            Bad Request - The provided id path parameter is missing or is not
            a valid positive integer.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
              examples:
                missing_id:
                  summary: The computer ID is zero or not a valid integer
                  value:
                    message: Missing asset ID
        "401":
          description: >
            Unauthorized - The request did not include a valid Bearer token,
            or the token has expired or is malformed.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
              examples:
                no_token:
                  summary: No token provided
                  value:
                    message: "Unauthorized Access: No Token Provided"
                invalid_token:
                  summary: Token is invalid or expired
                  value:
                    message: "Unauthorized Access: Invalid Token"
        "403":
          description: >
            Forbidden - The authenticated user does not have the IT Manager or
            IT Supervisor role assigned to their account.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
              examples:
                insufficient_permissions:
                  summary: User lacks the required role
                  value:
                    message: "Forbidden: Insufficient permissions"
        "500":
          description: >
            Internal Server Error - An unexpected error occurred on the server
            while attempting to retrieve the computer audit
            history, typically due to a database connectivity or query
            failure.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
              examples:
                server_error:
                  summary: Unexpected server-side failure
                  value:
                    message: Something went wrong

