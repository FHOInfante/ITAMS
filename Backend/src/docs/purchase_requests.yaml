  "/purchase-request/item/:id":
    patch:
      tags:
        - Purchase Requests
      summary: Settle a single purchase request item as Received or Voided
      description: >
        Moves one specific purchase request line item from item_status
        "In Process" into a terminal status — either **"Received"** or
        **"Voided"** — as specified by the required itemStatus field in the
        request body.


        This is a targeted, partial update — no other fields of the line
        item (item_description, item_quantity, unit_price) are affected.


        Typical use case: a PR has multiple line items and only some of them
        have physically arrived, while others may need to be voided (e.g.
        discontinued, no longer needed, or vendor unable to fulfill). The PR
        header itself may remain "In Process" while individual items are
        settled as they're resolved.


        **Auto-transition:** if settling this item leaves zero outstanding
        ("In Process") items on its parent purchase request, that purchase
        request is automatically transitioned as part of this same request:

        - If **at least one** item on the PR ended up **"Received"**,
          pr_status becomes **"Received"**. date_received and received_by
          are backfilled with the current date and current user, **only if
          they were still null** (values already set via
          PATCH /purchase-request/:id are left untouched).

        - If **every** item on the PR ended up **"Voided"** (none were ever
          received), pr_status becomes **"Cancelled"** instead. date_received
          and received_by are left untouched in this case.

        - The response's prAutoCompleted field is set to true, and
          prAutoStatus reflects which of the two outcomes occurred, so the
          caller can tell this happened without re-fetching the PR.


        If other items on the PR are still "In Process", none of the above
        happens — only this single item's item_status changes,
        prAutoCompleted is returned as false, and prAutoStatus is returned
        as null.


        **This endpoint is rejected with a 409 if the item has already been
        settled** (item_status is no longer "In Process" — it cannot be
        reverted back through this or any other endpoint), **or if the
        parent purchase request's pr_status is "Received" or "Cancelled"**.


        **Required Permission: 37 (Edit Purchase Requests)** — Accessible by: '**IT Manager**', '**IT Supervisor**', and '**System Specialist**'
      security:
        - BearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          description: "**[REQUIRED]** The item_id of the target purchase request line item."
          schema:
            type: integer
          example: 1
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PurchaseRequestItemStatusPatchRequest"
            examples:
              markReceived:
                summary: "Marking the item as Received"
                value:
                  itemStatus: "Received"
              markVoided:
                summary: "Marking the item as Voided"
                value:
                  itemStatus: "Voided"
      responses:
        "200":
          description: Purchase request item status updated.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PurchaseRequestItemStatusResponse"
              examples:
                itemReceivedOnly:
                  summary: "Item marked Received; other items on the PR are still In Process"
                  value:
                    message: "Purchase request item marked as Received"
                    prAutoCompleted: false
                    prAutoStatus: null
                itemVoidedOnly:
                  summary: "Item marked Voided; other items on the PR are still In Process"
                  value:
                    message: "Purchase request item marked as Voided"
                    prAutoCompleted: false
                    prAutoStatus: null
                lastItemAutoCompletesPrAsReceived:
                  summary: "This was the last In Process item, and at least one item is Received — parent PR auto-marked as Received"
                  value:
                    message: "Purchase request item marked as Received. All items are now settled — purchase request automatically marked as Received."
                    prAutoCompleted: true
                    prAutoStatus: "Received"
                lastItemAutoCancelsPr:
                  summary: "This was the last In Process item, and every item ended up Voided — parent PR auto-marked as Cancelled"
                  value:
                    message: "Purchase request item marked as Voided. All items have been voided — purchase request automatically marked as Cancelled."
                    prAutoCompleted: true
                    prAutoStatus: "Cancelled"
        "400":
          description: "Bad Request — The id path parameter is missing/invalid, or itemStatus is missing/invalid in the request body."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MessageResponse"
              examples:
                missingId:
                  summary: id path parameter is missing or invalid
                  value:
                    message: "Missing purchase request item ID"
                missingItemStatus:
                  summary: itemStatus was not provided in the request body
                  value:
                    message: "itemStatus is required"
                invalidItemStatus:
                  summary: itemStatus is not "Received" or "Voided"
                  value:
                    message: "itemStatus must be either 'Received' or 'Voided'"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          description: "Not Found — No purchase request item exists with the given ID."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MessageResponse"
              example:
                message: "Purchase request item not found"
        "409":
          description: "Conflict — The item has already been settled, or its parent purchase request can no longer be edited."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MessageResponse"
              examples:
                alreadyReceived:
                  summary: Item is already marked as Received
                  value:
                    message: 'This item is already marked as "Received" and can no longer be edited'
                alreadyVoided:
                  summary: Item is already marked as Voided
                  value:
                    message: 'This item is already marked as "Voided" and can no longer be edited'
                parentPrReceived:
                  summary: Parent purchase request status is Received
                  value:
                    message: 'Cannot update items on a purchase request with status "Received"'
                parentPrCancelled:
                  summary: Parent purchase request status is Cancelled
                  value:
                    message: 'Cannot update items on a purchase request with status "Cancelled"'
        "500":
          $ref: "#/components/responses/InternalError"