components:
  schemas:
    PurchaseRequestItem:
      type: object
      description: A single line item belonging to a purchase request, as returned by GET endpoints.
      properties:
        item_id:
          type: integer
          description: Auto-generated primary key of the line item.
          example: 1
        pr_id:
          type: integer
          description: Foreign key referencing the parent purchase request's pr_id.
          example: 1
        item_description:
          type: string
          description: Description of the item being procured.
          example: "Ink cartridge, black, Brother LC-3719XL"
        item_quantity:
          type: integer
          minimum: 1
          description: Number of units requested. Must be at least 1.
          example: 10
        unit_price:
          type: number
          format: float
          minimum: 0
          description: Cost per unit. Must be zero or greater.
          example: 350.00
        item_status:
          type: string
          enum:
            - In Process
            - Received
            - Voided
          description: >
            Current processing status of this specific line item. Defaults
            to "In Process" — either at PR creation time (unless overridden
            via itemStatus on that item), or unconditionally for any item
            added afterwards via POST /purchase-request/:id.

            Automatically forced to "Received" for every item on a purchase
            request the moment that purchase request's pr_status is set to
            "Received" via PATCH /purchase-request/:id. Automatically forced
            to "Voided" for every item the moment the parent purchase
            request's pr_status is set to "Cancelled" via the same endpoint
            (only possible when none of the PR's items are already
            "Received" — see PurchaseRequestPatchRequest below).

            **Once this value moves away from "In Process" it can no longer
            be changed.** An item can only ever transition one-way, from
            "In Process" to either "Received" or "Voided", via
            PATCH /purchase-request/item/:id.
          example: "In Process"

    PurchaseRequestObject:
      type: object
      description: Full purchase request record as returned by GET endpoints.
      properties:
        pr_id:
          type: integer
          example: 1
        pr_no:
          type: integer
          description: Official PR number. Must be unique across all purchase requests.
          example: 202400001
        pr_status:
          type: string
          enum:
            - Received
            - In Process
            - On Hold
            - Cancelled
          description: >
            Current processing status of the purchase request. A purchase
            request is created with this defaulted to "In Process" and can
            only be changed afterwards via PATCH /purchase-request/:id.

            **Once a purchase request's status is "Received" or "Cancelled",
            it can no longer be edited in any way** — its header fields
            cannot be changed, its items cannot be added to, and its items'
            statuses can no longer be changed.

            A purchase request is also automatically transitioned by the
            system (without a direct PATCH /purchase-request/:id call) once
            every one of its items has been individually settled via
            PATCH /purchase-request/item/:id: to **"Received"** if at least
            one item ended up Received, or to **"Cancelled"** if every item
            ended up Voided.
          example: "In Process"
        date_requested:
          type: string
          format: date
          description: Date the purchase request was filed. Set at creation and immutable afterwards.
          example: "2024-03-01"
        date_received:
          type: string
          format: date
          nullable: true
          description: >
            Date the goods were received. Editable via
            PATCH /purchase-request/:id. If still null when this purchase
            request is auto-completed as "Received" — either because its
            last outstanding item was individually settled via
            PATCH /purchase-request/item/:id, or because it was directly
            patched to "Received" — it is automatically backfilled with
            that day's date. Left untouched if the purchase request instead
            ends up "Cancelled".
          example: "2024-03-15"
        requested_by:
          type: string
          description: Free-text name of the person who requested the purchase.
          example: "Juan Dela Cruz"
        received_by:
          type: string
          nullable: true
          description: >
            Free-text name of the person who received the goods. Editable
            via PATCH /purchase-request/:id. If still null when this
            purchase request is auto-completed as "Received" (see
            date_received above for the exact conditions), it is
            automatically backfilled with the current user's name. Left
            untouched if the purchase request instead ends up "Cancelled".
          example: "Maria Santos"
        remarks:
          type: string
          nullable: true
          example: "Urgent — needed for ICU restocking"
        items:
          type: array
          description: >
            Line items belonging to this purchase request. This array is
            always present and always contains at least one item — items
            can no longer be deleted through the API; each line item is
            permanent for the lifetime of its parent purchase request and
            can only move forward through item_status.
          items:
            $ref: "#/components/schemas/PurchaseRequestItem"

    PurchaseRequestItemInput:
      type: object
      description: >
        A line item submitted as part of PurchaseRequestCreateRequest
        (POST /purchase-request). item_id is never supplied by the caller —
        it is auto-generated.
      required:
        - itemDescription
        - itemQuantity
        - unitPrice
      properties:
        itemDescription:
          type: string
          description: "**[REQUIRED]** Description of the item being procured."
          example: "Ink cartridge, black, Brother LC-3719XL"
        itemQuantity:
          type: integer
          minimum: 1
          description: "**[REQUIRED]** Number of units. Must be a positive integer."
          example: 10
        unitPrice:
          type: number
          format: float
          minimum: 0
          description: "**[REQUIRED]** Cost per unit. Must be zero or greater."
          example: 350.00
        itemStatus:
          type: string
          nullable: true
          enum:
            - In Process
            - Received
          description: >
            Optional. The starting status of this specific line item.
            Defaults to **"In Process"** if omitted. Only **"In Process"**
            or **"Received"** may be submitted here — **"Voided" is not a
            valid starting status** and can only be reached afterwards via
            PATCH /purchase-request/item/:id (a 400 error is returned for
            any other value, including "Voided").

            Since a newly created purchase request always starts at
            pr_status "In Process", this value is honored exactly as
            submitted — it is not overridden at creation time. To later
            settle an item as Received or Voided, use
            PATCH /purchase-request/item/:id, or set the parent PR's status
            to "Received" via PATCH /purchase-request/:id, which forces
            every item to Received.
          example: "In Process"

    NewPurchaseRequestItemInput:
      type: object
      description: >
        A line item submitted through POST /purchase-request/:id to add a new
        item to an existing purchase request. Unlike
        PurchaseRequestItemInput, this shape has no itemStatus field —
        items added after the fact are always unconditionally created with
        item_status "In Process", since starting an item already Received
        only makes sense at the time the PR itself is first filed.
      required:
        - itemDescription
        - itemQuantity
        - unitPrice
      properties:
        itemDescription:
          type: string
          description: "**[REQUIRED]** Description of the item being procured."
          example: "Toner cartridge, black, HP CF283A"
        itemQuantity:
          type: integer
          minimum: 1
          description: "**[REQUIRED]** Number of units. Must be a positive integer."
          example: 5
        unitPrice:
          type: number
          format: float
          minimum: 0
          description: "**[REQUIRED]** Cost per unit. Must be zero or greater."
          example: 3200.00

    PurchaseRequestCreateRequest:
      type: object
      required:
        - prNo
        - dateRequested
        - requestedBy
        - items
      properties:
        prNo:
          type: integer
          description: "**[REQUIRED]** Official PR number. Must be unique across all purchase requests."
          example: 202400001
        dateRequested:
          type: string
          format: date
          description: "**[REQUIRED]** Date the purchase request is being filed. Format: YYYY-MM-DD."
          example: "2024-03-01"
        requestedBy:
          type: string
          description: "**[REQUIRED]** Free-text name of the person who filed the purchase request."
          example: "Juan Dela Cruz"
        remarks:
          type: string
          nullable: true
          description: Optional. Free-text notes or remarks about this purchase request.
          example: "Urgent — needed for ICU restocking"
        items:
          type: array
          description: >
            **[REQUIRED]** Line items for this purchase request. Must contain
            at least one entry — a purchase request can never be created
            without items. Additional items can be added later via
            POST /purchase-request/:id.
          minItems: 1
          items:
            $ref: "#/components/schemas/PurchaseRequestItemInput"

    PurchaseRequestAddItemsRequest:
      description: >
        Request body for POST /purchase-request/:id. Accepts **either** a
        single item object **or** a JSON array of item objects, to support
        adding one or multiple items to an existing purchase request in a
        single call.
      oneOf:
        - $ref: "#/components/schemas/NewPurchaseRequestItemInput"
        - type: array
          minItems: 1
          items:
            $ref: "#/components/schemas/NewPurchaseRequestItemInput"

    PurchaseRequestPatchRequest:
      type: object
      description: >
        Request body for PATCH /purchase-request/:id. This is a partial
        update — every field is individually optional, but **at least one**
        of them must be present. prNo and dateRequested are immutable after
        creation and are not part of this shape.
      properties:
        prStatus:
          type: string
          nullable: true
          description: >
            Optional. New processing status for the purchase request. Must
            be one of: **Received**, **In Process**, **On Hold**,
            **Cancelled**.

            Setting this to **"Received" forces every one of this PR's line
            items to item_status = "Received"**, regardless of their prior
            state.

            Setting this to **"Cancelled" forces every one of this PR's line
            items to item_status = "Voided"**. This transition is **rejected
            with a 409 if any item on the PR is already "Received"** — a
            purchase request can only be cancelled while none of its items
            have been fulfilled yet.

            This field has no effect if the request is rejected because the
            purchase request's *current* status is already "Received" or
            "Cancelled" — see the 409 responses below.
          enum:
            - Received
            - In Process
            - On Hold
            - Cancelled
          example: "Received"
        requestedBy:
          type: string
          nullable: true
          description: Optional. Updated free-text name of the person who filed the purchase request. Must be a non-empty string when provided.
          example: "Juan Dela Cruz"
        receivedBy:
          type: string
          nullable: true
          description: Optional. Free-text name of the person who received the goods. Send null to clear an existing value.
          example: "Maria Santos"
        dateReceived:
          type: string
          format: date
          nullable: true
          description: "Optional. Date the goods were received. Format: YYYY-MM-DD. Send null to clear an existing value."
          example: "2024-03-15"
        remarks:
          type: string
          nullable: true
          description: Optional. Free-text notes or remarks about this purchase request. Send null to clear an existing value.
          example: "All items received in good condition."

    PurchaseRequestItemStatusPatchRequest:
      type: object
      description: >
        Request body for PATCH /purchase-request/item/:id. Unlike
        PurchaseRequestPatchRequest, this field is **required** on every
        call — this endpoint only ever performs one action: settling an
        item into a terminal status.
      required:
        - itemStatus
      properties:
        itemStatus:
          type: string
          description: >
            **[REQUIRED]** The terminal status to move this line item into.
            Must be one of: **Received**, **Voided**. Any other value
            (including "In Process") returns a 400 error.
          enum:
            - Received
            - Voided
          example: "Received"

    MessageResponse:
      type: object
      properties:
        message:
          type: string
          example: "Operation successful"

    PurchaseRequestItemStatusResponse:
      type: object
      description: Response body for PATCH /purchase-request/item/:id.
      properties:
        message:
          type: string
          example: "Purchase request item marked as Received"
        prAutoCompleted:
          type: boolean
          description: >
            True if settling this item also caused its parent purchase
            request to be automatically transitioned (because this was the
            last "In Process" item on that PR). False if the parent PR
            still has other unsettled items remaining.
          example: false
        prAutoStatus:
          type: string
          nullable: true
          enum:
            - Received
            - Cancelled
          description: >
            The pr_status the parent purchase request was automatically
            transitioned to, when prAutoCompleted is true: **"Received"** if
            at least one of its items ended up Received, or
            **"Cancelled"** if every one of its items ended up Voided. Null
            whenever prAutoCompleted is false.
          example: null

  responses:
    Unauthorized:
      description: "Unauthorized — No token provided or the token is invalid/expired."
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/MessageResponse"
          examples:
            noToken:
              summary: No token provided
              value:
                message: "Unauthorized Access: No Token Provided"
            invalidToken:
              summary: Token is invalid or expired
              value:
                message: "Unauthorized Access: Invalid Token"

    Forbidden:
      description: "Forbidden — Authenticated but the user does not have the required permission."
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/MessageResponse"
          example:
            message: "Forbidden: Insufficient permissions"

    NotFound:
      description: "Not Found — No purchase request exists with the given ID."
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/MessageResponse"
          example:
            message: "Purchase request not found"

    InternalError:
      description: "Internal Server Error — An unexpected server-side error occurred."
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/MessageResponse"
          example:
            message: "Something went wrong"

paths:
  /purchase-request:
    get:
      tags:
        - Purchase Requests
      summary: Get all purchase requests
      description: >
        Returns a list of all purchase request records. Each record includes
        the header-level PR fields and a nested items array containing all
        associated line items.


        **Required Permission: 7 (View Purchase Requests)** — Accessible by: '**IT Manager**', '**IT Supervisor**', and '**System Specialist**'
      security:
        - BearerAuth: []
      responses:
        "200":
          description: List of all purchase request records.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/PurchaseRequestObject"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "500":
          $ref: "#/components/responses/InternalError"

    post:
      tags:
        - Purchase Requests
      summary: Add a new purchase request
      description: >
        Creates a new purchase request along with its initial line items in a
        single request. The items array is required and must contain at
        least one entry — a purchase request can never be created without at
        least one item.


        The new purchase request always starts at pr_status **"In Process"**;
        prStatus cannot be set at creation time. To change its status
        afterwards, use PATCH /purchase-request/:id. To add further items
        later, use POST /purchase-request/:id.


        Line items are inserted as separate rows in the purchase_request_item
        table and linked to the newly created PR by pr_id.


        **Required Permission: 14 (Create Purchase Requests)** — Accessible by: '**IT Manager**', '**IT Supervisor**', and '**System Specialist**'
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PurchaseRequestCreateRequest"
            examples:
              minimal:
                summary: "Minimal — required fields only, single item"
                description: The bare minimum to create a valid PR. remarks is omitted (null).
                value:
                  prNo: 202400001
                  dateRequested: "2024-03-01"
                  requestedBy: "Juan Dela Cruz"
                  items:
                    - itemDescription: "Ink cartridge, black, Brother LC-3719XL"
                      itemQuantity: 10
                      unitPrice: 350.00

              withRemarks:
                summary: "With optional remarks filled in"
                value:
                  prNo: 202400002
                  dateRequested: "2024-03-05"
                  requestedBy: "Pedro Reyes"
                  remarks: "For the new nurses' station on the 4th floor."
                  items:
                    - itemDescription: "Thermal paper roll, 80mm"
                      itemQuantity: 50
                      unitPrice: 45.00
                    - itemDescription: "Ballpen, black, Pilot G2"
                      itemQuantity: 100
                      unitPrice: 22.50

              multipleItems:
                summary: "Multiple line items with mixed unit prices"
                value:
                  prNo: 202400003
                  dateRequested: "2024-04-01"
                  requestedBy: "Ana Lim"
                  items:
                    - itemDescription: "USB Flash Drive 32GB"
                      itemQuantity: 20
                      unitPrice: 250.00
                    - itemDescription: "HDMI Cable 1.8m"
                      itemQuantity: 5
                      unitPrice: 180.00
                    - itemDescription: "Ethernet Cable Cat6 (per meter)"
                      itemQuantity: 100
                      unitPrice: 35.00

              zeroUnitPrice:
                summary: "Item with zero unit price (donated or issued at no cost)"
                description: unitPrice can be 0.00 for items that are received at no charge.
                value:
                  prNo: 202400004
                  dateRequested: "2024-05-01"
                  requestedBy: "IT Department"
                  items:
                    - itemDescription: "Sample unit — Epson L3210 (evaluation)"
                      itemQuantity: 1
                      unitPrice: 0.00

              partiallyPreReceivedItems:
                summary: "PR with some items already individually received"
                description: >
                  A new PR always starts "In Process", so each item's
                  itemStatus value is honored as submitted. The toner
                  (already in stock) is saved with item_status "Received"
                  while the drum unit — still awaiting delivery — is saved
                  with the default item_status "In Process".
                value:
                  prNo: 202400005
                  dateRequested: "2024-05-10"
                  requestedBy: "Liza Fernandez"
                  remarks: "Toner was already on hand; drum unit still on order."
                  items:
                    - itemDescription: "Toner cartridge, black, HP CF283A"
                      itemQuantity: 5
                      unitPrice: 3200.00
                      itemStatus: "Received"
                    - itemDescription: "Drum unit, HP DR-3400"
                      itemQuantity: 1
                      unitPrice: 5800.00
                      itemStatus: "In Process"
      responses:
        "201":
          description: Purchase request added successfully.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MessageResponse"
              example:
                message: "Purchase request added successfully"
        "400":
          description: "Bad Request — Required fields are missing, or the items array failed validation."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MessageResponse"
              examples:
                missingRequiredFields:
                  summary: prNo, dateRequested, or requestedBy is missing
                  value:
                    message: "Missing required fields"
                noItems:
                  summary: items array is missing or empty
                  value:
                    message: "At least one item is required"
                incompleteItem:
                  summary: An item is missing itemDescription, itemQuantity, or unitPrice
                  value:
                    message: "Each item must have itemDescription, itemQuantity, and unitPrice"
                invalidItemQuantity:
                  summary: itemQuantity is not a positive number
                  value:
                    message: "itemQuantity must be a positive number"
                invalidUnitPrice:
                  summary: unitPrice is negative or not a number
                  value:
                    message: "unitPrice must be a non-negative number"
                invalidItemStatus:
                  summary: itemStatus is not "In Process" or "Received"
                  value:
                    message: "itemStatus must be either 'In Process' or 'Received' when provided"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "500":
          $ref: "#/components/responses/InternalError"

  "/purchase-request/:id":
    get:
      tags:
        - Purchase Requests
      summary: Get a single purchase request
      description: >
        Returns one purchase request record, including its full header
        fields and its nested items array.


        **Required Permission: 7 (View Purchase Requests)** — Accessible by: '**IT Manager**', '**IT Supervisor**', and '**System Specialist**'
      security:
        - BearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          description: "**[REQUIRED]** The pr_id of the target purchase request."
          schema:
            type: integer
          example: 1
      responses:
        "200":
          description: The requested purchase request record.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PurchaseRequestObject"
        "400":
          description: "Bad Request — The id path parameter is missing or not a valid integer."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MessageResponse"
              example:
                message: "Missing purchase request ID"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "500":
          $ref: "#/components/responses/InternalError"

    post:
      tags:
        - Purchase Requests
      summary: Add item(s) to an existing purchase request
      description: >
        Adds one or more new line items to an already-existing purchase
        request. Accepts either a single item object or a JSON array of item
        objects in the request body.


        Items added through this endpoint are always created with
        item_status **"In Process"** — this request shape has no itemStatus
        field.


        **This endpoint is rejected with a 409 if the target purchase
        request's pr_status is "Received" or "Cancelled"**.


        **Required Permission: 14 (Create Purchase Requests)** — Accessible by: '**IT Manager**', '**IT Supervisor**', and '**System Specialist**'
      security:
        - BearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          description: "**[REQUIRED]** The pr_id of the target purchase request."
          schema:
            type: integer
          example: 1
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PurchaseRequestAddItemsRequest"
            examples:
              singleItem:
                summary: "Adding a single item"
                value:
                  itemDescription: "Toner cartridge, black, HP CF283A"
                  itemQuantity: 5
                  unitPrice: 3200.00
              multipleItems:
                summary: "Adding multiple items in one call"
                value:
                  - itemDescription: "Network switch, 8-port unmanaged"
                    itemQuantity: 2
                    unitPrice: 1450.00
                  - itemDescription: "Patch cable, Cat6, 1m"
                    itemQuantity: 30
                    unitPrice: 65.00
      responses:
        "201":
          description: Purchase request item(s) added successfully.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MessageResponse"
              example:
                message: "Purchase request item(s) added successfully"
        "400":
          description: "Bad Request — The id path parameter is missing/invalid, or the item(s) payload failed validation."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MessageResponse"
              examples:
                missingId:
                  summary: id path parameter is missing or invalid
                  value:
                    message: "Missing purchase request ID"
                noItems:
                  summary: Payload is missing or empty
                  value:
                    message: "At least one item is required"
                incompleteItem:
                  summary: An item is missing itemDescription, itemQuantity, or unitPrice
                  value:
                    message: "Each item must have itemDescription, itemQuantity, and unitPrice"
                invalidItemQuantity:
                  summary: itemQuantity is not a positive number
                  value:
                    message: "itemQuantity must be a positive number"
                invalidUnitPrice:
                  summary: unitPrice is negative or not a number
                  value:
                    message: "unitPrice must be a non-negative number"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          description: "Conflict — The purchase request's current status no longer allows adding items."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MessageResponse"
              examples:
                parentPrReceived:
                  summary: Parent purchase request status is Received
                  value:
                    message: 'Cannot add items to a purchase request with status "Received"'
                parentPrCancelled:
                  summary: Parent purchase request status is Cancelled
                  value:
                    message: 'Cannot add items to a purchase request with status "Cancelled"'
        "500":
          $ref: "#/components/responses/InternalError"

    patch:
      tags:
        - Purchase Requests
      summary: Update a purchase request's header fields / status
      description: >
        Partially updates a purchase request's header-level fields:
        prStatus, requestedBy, receivedBy, dateReceived, and/or remarks.
        This is a partial update — any subset of these fields may be sent,
        but at least one must be present. prNo and dateRequested are
        immutable and are not part of this endpoint's request body.


        **Setting prStatus to "Received" forces every one of this PR's line
        items to item_status "Received"**, regardless of their prior
        individual state.


        **Setting prStatus to "Cancelled" forces every one of this PR's line
        items to item_status "Voided"** — but only if none of them are
        already "Received"; otherwise the request is rejected with a 409
        (see below).


        **This endpoint is rejected with a 409 if the purchase request's
        *current* pr_status is already "Received" or "Cancelled"**.


        **Required Permission: 37 (Edit Purchase Requests)** — Accessible by: '**IT Manager**', '**IT Supervisor**', and '**System Specialist**'
      security:
        - BearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          description: "**[REQUIRED]** The pr_id of the target purchase request."
          schema:
            type: integer
          example: 1
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PurchaseRequestPatchRequest"
            examples:
              markReceived:
                summary: "Directly marking the whole PR as Received"
                description: Forces every line item on this PR to item_status "Received".
                value:
                  prStatus: "Received"
                  receivedBy: "Maria Santos"
                  dateReceived: "2024-03-15"
              cancelPr:
                summary: "Cancelling a PR with no received items yet"
                description: Forces every line item on this PR to item_status "Voided".
                value:
                  prStatus: "Cancelled"
